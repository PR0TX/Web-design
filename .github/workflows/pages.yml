name: Deploy labs to Pages
run-name: Deploy ${{ github.ref_name }} to Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish ${{ github.ref_name }} to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Download current gh-pages branch if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" existing-pages
          else
            mkdir -p existing-pages
          fi

      - name: Build Pages artifact
        env:
          LAB_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu

          LAB_DIR="$(printf '%s' "$LAB_BRANCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p public

          if [ -d existing-pages/.git ]; then
            rsync -a --exclude '.git' existing-pages/ public/
          fi

          rm -rf "public/$LAB_DIR"
          mkdir -p "public/$LAB_DIR"
          rsync -a Site/ "public/$LAB_DIR/"
          touch public/.nojekyll

          python3 - <<'PY'
          from pathlib import Path

          public_dir = Path('public')
          lab_dirs = sorted(
              [path.name for path in public_dir.iterdir() if path.is_dir() and path.name.startswith('lab')],
              key=lambda item: (len(item), item)
          )

          links = '\n'.join(
              f'      <li><a href="./{lab}/index.html">{lab.upper()}</a></li>'
              for lab in lab_dirs
          ) or '      <li>Ще немає опублікованих лабораторних.</li>'

          index_html = f"""<!DOCTYPE html>
          <html lang="uk">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Web Design Labs</title>
            <style>
              body {{
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f8fafc;
                color: #0f172a;
              }}
              main {{
                max-width: 720px;
                margin: 0 auto;
                padding: 48px 20px;
              }}
              h1 {{
                margin-bottom: 12px;
              }}
              p {{
                color: #475569;
              }}
              ul {{
                padding-left: 20px;
              }}
              li + li {{
                margin-top: 10px;
              }}
              a {{
                color: #1d4ed8;
                text-decoration: none;
                font-weight: 700;
              }}
              a:hover {{
                text-decoration: underline;
              }}
            </style>
          </head>
          <body>
            <main>
              <h1>Опубліковані лабораторні роботи</h1>
              <ul>
          {links}
              </ul>
            </main>
          </body>
          </html>
          """

          (public_dir / 'index.html').write_text(index_html, encoding='utf-8')
          PY

      - name: Publish site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LAB_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu

          cd public
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Publish ${LAB_BRANCH}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
