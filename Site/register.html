<!-- register.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChronoTrack - Реєстрація</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
  <div id="app" v-cloak>
  <header class="site-header border-bottom">
    <div class="container py-3 d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3">
      <a class="text-decoration-none text-center text-sm-start brand-link" data-page-link href="index.html">
        <span class="brand-name">ChronoTrack</span>
      </a>
      <nav class="nav nav-pills flex-row flex-wrap site-nav ms-sm-auto">
        <a class="nav-link" data-auth-link v-show="authReady && isAuthenticated" data-page-link href="index.html">Робоча область</a>
        <a class="nav-link" data-auth-link v-show="authReady && isAuthenticated" data-page-link href="profile.html">Профіль</a>
        <a class="nav-link" data-page-link href="about.html">Про додаток</a>
        <a class="nav-link" data-page-link data-guest-link v-show="authReady && !isAuthenticated" href="login.html">Вхід</a>
        <a class="nav-link active" data-page-link data-guest-link v-show="authReady && !isAuthenticated" aria-current="page" href="register.html">Реєстрація</a>
      </nav>
    </div>
  </header>

  <main
    class="container py-5"
    v-motion
    :initial="{ opacity: 0, x: 40 }"
    :animate="{ opacity: 1, x: 0 }"
    :transition="{ duration: 0.3, ease: 'easeInOut' }"
  >
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-lg-5">
            <h1 class="h4 section-title text-center">Реєстрація користувача</h1>
            <p class="text-muted text-center mb-4">Заповніть обов'язкові поля для створення профілю.</p>
            <form id="register-form" novalidate @submit.prevent="submitForm">
              <div class="mb-3">
                <label class="form-label" for="register-name">Ім'я</label>
                <input id="register-name" v-model.trim="form.fullName" name="fullName" type="text" class="form-control" placeholder="Павло Протченко" autocomplete="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="register-email">Email</label>
                <input id="register-email" v-model.trim="form.email" name="email" type="email" class="form-control" placeholder="example@mail.com" autocomplete="email" required>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" for="register-gender">Стать</label>
                  <select id="register-gender" v-model="form.gender" name="gender" class="form-select" required>
                    <option value="" selected disabled>Оберіть</option>
                    <option value="Чоловіча">Чоловіча</option>
                    <option value="Жіноча">Жіноча</option>
                    <option value="Інше">Інше</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="register-birth-date">Дата народження</label>
                  <input id="register-birth-date" v-model="form.birthDate" name="birthDate" type="date" class="form-control" autocomplete="bday" required>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" for="register-password">Пароль</label>
                  <input id="register-password" v-model="form.password" name="password" type="password" class="form-control" placeholder="Не менше 8 символів" autocomplete="new-password" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="register-password-confirm">Підтвердження пароля</label>
                  <input id="register-password-confirm" v-model="form.passwordConfirm" name="passwordConfirm" type="password" class="form-control" placeholder="Повторіть пароль" autocomplete="new-password" required>
                </div>
              </div>
              <div v-if="feedback" id="register-feedback" :class="['alert', `alert-${feedback.type}`, 'mb-3']" role="status" aria-live="polite">{{ feedback.message }}</div>
              <button type="submit" class="btn btn-primary w-100" :disabled="loading">{{ buttonLabel }}</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top bg-white">
    <div class="container py-4 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div class="small text-muted">ChronoTrack © 2026. Усі права захищені.</div>
      <div class="footer-links d-flex flex-wrap gap-3 small">
        <a href="#">Політика конфіденційності</a>
        <a href="#">Умови використання</a>
        <a href="#">Підтримка</a>
      </div>
    </div>
  </footer>
  </div>
  <script>
    window.process = window.process || { env: { NODE_ENV: 'production' } };
  </script>
  <script type="importmap">
    {
      "imports": {
        "vue": "/vendor/vue/vue.esm-browser.prod.js",
        "motion-v": "/vendor/motion-v/index.mjs",
        "motion-dom": "/vendor/motion-dom/index.mjs",
        "motion-utils": "/vendor/motion-utils/index.mjs",
        "framer-motion": "/vendor/framer-motion/index.mjs",
        "framer-motion/dom": "/vendor/framer-motion/dom.mjs",
        "@vueuse/core": "/vendor/@vueuse/core/index.js",
        "@vueuse/shared": "/vendor/@vueuse/shared/index.js",
        "hey-listen": "/vendor/hey-listen/hey-listen.es.js"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
